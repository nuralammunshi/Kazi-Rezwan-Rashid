{% extends 'portfolio/admin/dashboard_base.html' %}

{% block title %}Confirm Deletion — Portfolio Hub{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 540px; margin: 40px auto; text-align: center; padding: 40px 32px;">
  <div style="width: 60px; height: 60px; background: rgba(239, 68, 68, 0.15); color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 20px;">
    <span class="lnr lnr-trash"></span>
  </div>

  <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin-bottom: 10px;">Are you sure?</h2>
  <p style="color: var(--dash-muted); font-size: 14px; margin-bottom: 24px;">
    You are about to permanently delete: <br>
    <b style="color: #fff; font-size: 15px;">{{ item }}</b>
    <br><br>
    This action cannot be undone.
  </p>

  <form method="post">
    {% csrf_token %}
    <div style="display: flex; justify-content: center; gap: 14px;">
      <a class="btn-secondary" href="{% url back_url %}">No, Cancel</a>
      <button class="btn-danger" type="submit" style="padding: 10px 24px; font-size: 14px;">Yes, Delete It</button>
    </div>
  </form>
</div>
{% endblock %}
